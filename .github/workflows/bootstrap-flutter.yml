name: Bootstrap Flutter project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate official Flutter project files
        run: |
          flutter create . \
            --project-name medhistory \
            --platforms=android,ios,web,windows,macos,linux

      - name: Restore project dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap-flutter.yml

      - name: Commit generated skeleton
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap official Flutter project skeleton" || exit 0
          git push
